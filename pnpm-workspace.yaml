# pnpm 11 blocks dependency build scripts by default and aborts CI installs
# with ERR_PNPM_IGNORED_BUILDS until each is explicitly approved here. These
# deps legitimately need their install/build scripts (native builds:
# sharp/bcrypt/esbuild/unrs-resolver; postinstall: core-js/protobufjs/msw/etc).
# Dependency overrides. pnpm 11 reads overrides from here (the package.json
# `pnpm.overrides` block is not applied under this setup). Used to pin
# transitive deps to patched versions for security advisories Dependabot
# can't fix directly (e.g. dompurify is pulled in transitively via posthog-js).
overrides:
  '@babel/core@<=7.29.0': '>=7.29.6 <8.0.0'
  '@types/react': '19.2.15'
  '@types/react-dom': '19.2.3'
  'axios@<1.16.0': '>=1.16.0'
  'basic-ftp@<=5.3.0': '>=5.3.1'
  'body-parser@<1.20.6': '>=1.20.6 <2.0.0'
  'brace-expansion@<1.1.17': '>=1.1.17 <2.0.0'
  'brace-expansion@>=2.0.0 <2.1.3': '>=2.1.3 <3.0.0'
  'brace-expansion@>=3.0.0 <3.0.3': '>=3.0.3 <4.0.0'
  'brace-expansion@>=4.0.0 <5.0.8': '>=5.0.8'
  '@isaacs/brace-expansion@<=5.0.0': '>=5.0.1'
  'dompurify@<=3.4.11': '>=3.4.12'
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1 <0.29.0'
  'fast-uri@<2.4.4': '>=2.4.4 <3.0.0'
  'fast-uri@>=3.0.0 <3.1.5': '>=3.1.5 <4.0.0'
  'fast-uri@>=4.0.0 <4.1.2': '>=4.1.2'
  'fast-xml-builder@<=1.1.6': '>=1.1.7'
  'flatted@<=3.4.1': '>=3.4.2'
  'follow-redirects@<=1.15.11': '>=1.16.0'
  'form-data@>=4.0.0 <4.0.6': '>=4.0.6'
  'ip-address@<10.2.2': '>=10.2.2'
  'js-yaml@<3.15.0': '>=3.15.0 <4.0.0'
  'js-yaml@>=4.0.0 <=4.1.1': '>=4.2.0 <5.0.0'
  'lodash@<=4.17.23': '>=4.18.0'
  'lodash-es@<=4.17.23': '>=4.18.0'
  # lodash.pick has no patched release: the advisory names 4.4.1 as the fix but
  # npm's latest is still 4.4.0, so it cannot be pinned. It reaches us only via
  # structured-data-testing-tool -> web-auto-extractor -> cheerio@0.22.0, a
  # devDependency run by hand against our own markup, so there is no exposure.
  'minimatch@<3.1.4': '>=3.1.4'
  'minimatch@>=9.0.0 <9.0.7': '>=9.0.7'
  'minimatch@>=10.0.0 <10.2.3': '>=10.2.3'
  'nth-check@<2.0.1': '>=2.0.1'
  'path-to-regexp@<0.1.13': '>=0.1.13'
  'picomatch@>=4.0.0 <4.0.4': '>=4.0.4'
  'postcss@<8.5.18': '>=8.5.18'
  'qs@<6.15.2': '>=6.15.2'
  # next pulls in its own optional sharp (0.34.x) alongside our direct ^0.35.0
  # dependency; both instances carry the libvips CVEs, so pin the transitive
  # copy up to the patched line as well.
  'sharp@<0.35.0': '>=0.35.0 <0.36.0'
  'tmp@<=0.2.3': '>=0.2.4'
  # Two undici instances live in the tree: a dev-only 7.x from jsdom/vitest's
  # test runtime, and a runtime 6.x that @vercel/blob depends on directly.
  # Both are pinned within their own major - @vercel/blob declares
  # "undici": "^6.23.0", so forcing its copy to 7.x would break blob storage.
  'undici@>=6.0.0 <6.28.0': '>=6.28.0 <7.0.0'
  'undici@>=7.0.0 <7.29.0': '>=7.29.0 <8.0.0'
  'uuid@<11.1.1': '>=11.1.1'
  'validator@<13.15.22': '>=13.15.22'
  # ws 7.x is dev-only (lighthouse / @lhci/cli); 8.x is pinned separately.
  'ws@>=7.0.0 <7.5.11': '>=7.5.11 <8.0.0'
  'ws@>=8.0.0 <8.21.0': '>=8.21.0'

allowBuilds:
  '@posthog/cli': true
  bcrypt: true
  bufferutil: true
  core-js: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
